<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Complaint - Villa Market S33</title>
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; padding: 15px; background: #f3f5f8; font-family: Arial, "Noto Sans Thai", sans-serif; }
        .container { max-width: 480px; margin: auto; }
        .header { background: #d71920; color: white; padding: 25px; border-radius: 18px; text-align: center; }
        .header h1 { margin: 0; font-size: 26px; }
        .card { background: white; padding: 20px; margin-top: 15px; border-radius: 18px; }
        label { font-weight: bold; display: block; margin-top: 15px; }
        input, textarea, select { width: 100%; padding: 12px; font-size: 16px; border-radius: 10px; border: 1px solid #ccc; margin-top: 8px; }
        textarea { height: 120px; }
        button { width: 100%; height: 55px; margin-top: 20px; background: #d71920; color: white; border: none; border-radius: 12px; font-size: 18px; font-weight: bold; cursor: pointer; }
        button:disabled { cursor: not-allowed; }
        .line-box { background: #fff0f0; padding: 12px; border-radius: 10px; display: flex; justify-content: space-between; align-items: center; }
        .status { margin-top: 15px; font-size: 13px; color: #666; }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1 class="i18n" data-th="🔴 คอมเพลนลูกค้า" data-en="🔴 Customer Complaint">🔴 คอมเพลนลูกค้า</h1>
        <p>Villa Market สุขุมวิท 33</p>
    </div>

    <div class="card">
        <div class="line-box">
            <div><span class="i18n" data-th="ผู้รับเรื่อง:" data-en="Receiver:">ผู้รับเรื่อง:</span> <span id="userName">กำลังโหลด...</span></div>
        </div>

        <label class="i18n" data-th="รายละเอียดปัญหาจากลูกค้า" data-en="Complaint Details">รายละเอียดปัญหาจากลูกค้า</label>
        <textarea id="detail" class="i18n-ph" data-th-ph="ระบุรายละเอียดปัญหา" data-en-ph="Specify problem details"></textarea>

        <label class="i18n" data-th="ชื่อลูกค้า / เบอร์ติดต่อ" data-en="Customer Name / Contact">ชื่อลูกค้า / เบอร์ติดต่อ</label>
        <input id="customer" class="i18n-ph" data-th-ph="ถ้ามี" data-en-ph="Optional">

        <label class="i18n" data-th="การดำเนินการแก้ไข" data-en="Corrective Action Taken">การดำเนินการแก้ไข</label>
        <textarea id="requestAction" class="i18n-ph" data-th-ph="หัวหน้างานดำเนินการอย่างไร" data-en-ph="Action taken by supervisor"></textarea>

        <label class="i18n" data-th="สถานะ" data-en="Status">สถานะ</label>
        <select id="status">
            <option value="เสร็จสิ้น" class="i18n" data-th="เสร็จสิ้น" data-en="Completed">เสร็จสิ้น</option>
            <option value="รอดำเนินการ" class="i18n" data-th="รอดำเนินการ" data-en="Pending">รอดำเนินการ</option>
        </select>

        <button id="submitBtn" onclick="saveData()" class="i18n" data-th="บันทึกข้อมูล" data-en="Submit Data">บันทึกข้อมูล</button>
        <div id="msg" class="status"><span class="i18n" data-th="สถานะ :" data-en="Status :">สถานะ :</span> <span id="status-text" class="i18n" data-th="เริ่มต้น" data-en="Ready">เริ่มต้น</span></div>
    </div>
</div>

<script>
    const LIFF_ID = "2011171771-2kU5r1Xp";
    const API_URL = "https://script.google.com/macros/s/AKfycbzGCd61ZDWRSXVibhE73_fW8eZX-R-pLlOSAUI5fFPdNdZ3-cUMVGsOAwRNP754ugq8YQ/exec";
    let lineUser = {};
    let currentLang = 'TH';

    function switchLanguage(lang) {
        currentLang = lang;

        document.querySelectorAll('.i18n').forEach(el => {
            const text = el.getAttribute(`data-${lang.toLowerCase()}`);
            if (text) el.innerText = text;
        });
        document.querySelectorAll('.i18n-ph').forEach(input => {
            const ph = input.getAttribute(`data-${lang.toLowerCase()}-ph`);
            if (ph) input.placeholder = ph;
        });
    }

    async function initLINE() {
    try {
        await liff.init({ liffId: LIFF_ID });
        if (!liff.isLoggedIn()) {
            liff.login();
            return;
        }
        const profile = await liff.getProfile();
        lineUser = { id: profile.userId, name: profile.displayName };
        document.getElementById("userName").innerText = profile.displayName;

        // 🟢 1. แสดงฟอร์มทันทีเพื่อให้ผู้ใช้ไม่ต้องนั่งรอ
        document.getElementById("form-content").style.display = "block";

        // 🟢 2. ยิงเช็กสิทธิ์และภาษาเบื้องหลัง (Async) ไม่ใช้ await บล็อกหน้าจอ
        fetch(`${API_URL}?action=getUserLang&lineUserId=${profile.userId}`)
            .then(r => r.json())
            .then(res => {
                if (res.registered) {
                    if (res.lang) switchLanguage(res.lang);
                } else {
                    // ถ้าไม่พบการลงทะเบียน ค่อยปิดฟอร์มแล้วแสดงหน้าปฏิเสธสิทธิ์
                    document.getElementById("form-content").style.display = "none";
                    document.getElementById("access-denied").style.display = "block";
                }
            })
            .catch(() => {
                // กรณี API มีปัญหา
            });

    } catch (e) {
        document.getElementById("form-content").style.display = "none";
        document.getElementById("access-denied").style.display = "block";
    }
}

    async function saveData() {
        const submitBtn = document.getElementById("submitBtn");
        if (submitBtn.disabled) return; // กันกดซ้ำระหว่างกำลังส่งข้อมูล

        const detail = document.getElementById("detail").value.trim();
        if (detail === "") {
            alert(currentLang === 'TH' ? "กรุณากรอกรายละเอียด" : "Please enter details");
            return;
        }

        const data = {
            action: "saveCustomer",
            type: "คอมเพลนลูกค้า",
            detail: detail,
            customer: document.getElementById("customer").value,
            requestAction: document.getElementById("requestAction").value,
            status: document.getElementById("status").value,
            userName: lineUser.name,
            lineUserId: lineUser.id
        };

        submitBtn.disabled = true;
        submitBtn.style.opacity = "0.6";
        submitBtn.style.cursor = "not-allowed";

        try {
            document.getElementById("status-text").innerText = currentLang === 'TH' ? "กำลังบันทึกข้อมูล..." : "Saving...";
            const response = await fetch(API_URL, {
                method: "POST",
                headers: { "Content-Type": "text/plain" },
                body: JSON.stringify(data)
            });
            const result = await response.json();
            alert(result.message || (currentLang === 'TH' ? "บันทึกสำเร็จ" : "Saved successfully"));
            if (result.success) {
                liff.closeWindow();
            } else {
                submitBtn.disabled = false;
                submitBtn.style.opacity = "1";
                submitBtn.style.cursor = "pointer";
                document.getElementById("status-text").innerText = currentLang === 'TH' ? "เริ่มต้น" : "Ready";
            }
        } catch (err) {
            alert(currentLang === 'TH' ? "เกิดข้อผิดพลาดในการบันทึกข้อมูล" : "Error saving data");
            submitBtn.disabled = false;
            submitBtn.style.opacity = "1";
            submitBtn.style.cursor = "pointer";
        }
    }

    initLINE();
</script>
</body>
</html>
