<!DOCTYPE html>
<html lang="th">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>
Complaint - Villa Market S33
</title>


<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>


<style>

*{
box-sizing:border-box;
}


body{

margin:0;
padding:15px;

background:#f3f5f8;

font-family:
Arial,
"Noto Sans Thai",
sans-serif;

}


.container{

max-width:480px;
margin:auto;

}


.header{

background:#d71920;

color:white;

padding:25px;

border-radius:18px;

text-align:center;

}



.card{

background:white;

padding:20px;

margin-top:15px;

border-radius:18px;

}



.line-box{

background:#fff0f0;

padding:12px;

border-radius:10px;

}



label{

font-weight:bold;

display:block;

margin-top:15px;

}



input,
textarea,
select{


width:100%;

padding:12px;

font-size:16px;

border-radius:10px;

border:1px solid #ccc;

margin-top:8px;


}



textarea{

height:120px;

}



button{

width:100%;

height:55px;

margin-top:20px;

background:#d71920;

color:white;

border:none;

border-radius:12px;

font-size:18px;

font-weight:bold;

}



.status{

margin-top:15px;

font-size:13px;

color:#666;

}


</style>


</head>


<body>


<div class="container">


<div class="header">

<h1>
🔴 Complaint ลูกค้า
</h1>


<p>
Villa Market สุขุมวิท 33
</p>

</div>




<div class="card">



<div class="line-box">

ผู้รับเรื่อง :

<span id="userName">
กำลังโหลด...
</span>

</div>



<label>
รายละเอียดปัญหาจากลูกค้า
</label>


<textarea 
id="detail"
placeholder="ระบุรายละเอียดปัญหา">
</textarea>




<label>
ชื่อลูกค้า / เบอร์ติดต่อ
</label>


<input

id="customer"

placeholder="ถ้ามี"

>




<label>
การดำเนินการแก้ไข
</label>


<textarea

id="requestAction"

placeholder="หัวหน้างานดำเนินการอย่างไร">

</textarea>




<label>
สถานะ
</label>


<select id="status">

<option value="เสร็จสิ้น">
เสร็จสิ้น
</option>

<option value="รอดำเนินการ">
รอดำเนินการ
</option>


</select>




<button onclick="saveData()">

บันทึกข้อมูล

</button>



<div id="msg" class="status">

สถานะ : เริ่มต้น

</div>



</div>

</div>





<script>


const LIFF_ID =
"2011171771-2kU5r1Xp";



const API_URL =
"https://script.google.com/macros/s/AKfycbx6X9CED9Pewba4t64zCJWk0Q3gf__iQ_MhXY45tRYYTj0nclmOzp13BP-w6vdKSGOKFw/exec";



let lineUser = {};





async function initLINE(){


try{


await liff.init({

liffId:LIFF_ID

});



if(!liff.isLoggedIn()){


liff.login();

return;

}



const profile =
await liff.getProfile();



lineUser={


id:
profile.userId,


name:
profile.displayName


};



document
.getElementById("userName")
.innerHTML =
profile.displayName;



}

catch(error){


document
.getElementById("msg")
.innerHTML =
"LINE Error : "+error.message;


}


}






async function saveData(){



try{



const data={



action:
"saveCustomer",



type:
"คอมเพลนลูกค้า",



detail:
document
.getElementById("detail")
.value,



customer:
document
.getElementById("customer")
.value,



requestAction:
document
.getElementById("requestAction")
.value,



status:
document
.getElementById("status")
.value,



lineUserId:
lineUser.id



};



document
.getElementById("msg")
.innerHTML =
"กำลังบันทึก...";





const response =
await fetch(

API_URL,

{

method:"POST",

headers:{

"Content-Type":"text/plain"

},

body:

JSON.stringify(data)

}

);





const result =
await response.json();




alert(result.message);



document
.getElementById("msg")
.innerHTML =
result.message;




}

catch(error){


alert(
"Error : "+error.message
);


document
.getElementById("msg")
.innerHTML =
error.message;


}


}





initLINE();


</script>



</body>

</html>
