<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ติดตามสินค้า - Villa Market S33</title>
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; padding: 15px; background: #f3f5f8; font-family: Arial, "Noto Sans Thai", sans-serif; }
        .container { max-width: 480px; margin: auto; }
        .header { background: #005bbb; color: white; padding: 25px; border-radius: 18px; text-align: center; }
        .header h1 { margin: 0; font-size: 26px; }
        .card { background: white; padding: 20px; border-radius: 18px; margin-top: 15px; }
        label { font-weight: bold; display: block; margin-top: 15px; }
        input, textarea, select { width: 100%; padding: 12px; font-size: 16px; border-radius: 10px; border: 1px solid #ccc; margin-top: 8px; }
        textarea { height: 100px; }
        button { width: 100%; height: 55px; margin-top: 20px; background: #005bbb; color: white; border: none; border-radius: 12px; font-size: 18px; font-weight: bold; cursor: pointer; }
        .line-box { background: #eef5ff; padding: 12px; border-radius: 10px; display: flex; justify-content: space-between; align-items: center; }
        .status { font-size: 13px; color: #666; margin-top: 15px; }

        .checkbox-group { margin-top: 8px; display: flex; flex-direction: column; gap: 10px; }
        .checkbox-item { display: flex; align-items: center; background: #f7f9fc; border: 1px solid #ddd; border-radius: 10px; padding: 12px; cursor: pointer; }
        .checkbox-item input[type="checkbox"] { width: auto; margin: 0 10px 0 0; padding: 0; accent-color: #005bbb; transform: scale(1.2); }
        .checkbox-item span { font-weight: normal; }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1 class="i18n" data-th="🔵 ติดตามสินค้า" data-en="🔵 Product Tracking">🔵 ติดตามสินค้า</h1>
        <p>Villa Market สุขุมวิท 33</p>
    </div>

    <div class="card" id="access-denied">
        <h2 style="color:#d71920; margin-top:0;" class="i18n" data-th="⚠️ ไม่พบข้อมูลพนักงาน" data-en="⚠️ Employee Not Found">⚠️ ไม่พบข้อมูลพนักงาน</h2>
        <p class="i18n" data-th="กรุณาลงทะเบียนพนักงานก่อนเข้าใช้งานระบบ" data-en="Please register as an employee before using the system.">กรุณาลงทะเบียนพนักงานก่อนเข้าใช้งานระบบ</p>
        <button class="reg-btn i18n" onclick="liff.closeWindow()" data-th="ปิดหน้าต่าง" data-en="Close Window">ปิดหน้าต่าง</button>
    </div>

    <div class="card" id="form-content" style="display:none;">
        <div class="line-box">
            <div><span class="i18n" data-th="ผู้รับเรื่อง:" data-en="Receiver:">ผู้รับเรื่อง:</span> <span id="userName">กำลังโหลด...</span></div>
        </div>

        <label class="i18n" data-th="ประเภทเรื่อง" data-en="Request Type">ประเภทเรื่อง</label>
        <div class="checkbox-group">
            <label class="checkbox-item">
                <input type="checkbox" id="cbAsk" value="ลูกค้าถามหาสินค้า" onclick="selectRequestType('cbAsk')">
                <span class="i18n" data-th="ลูกค้าถามหาสินค้า" data-en="Customer asking for a product">ลูกค้าถามหาสินค้า</span>
            </label>
            <label class="checkbox-item">
                <input type="checkbox" id="cbFollow" value="ติดตามสินค้าให้ลูกค้า" onclick="selectRequestType('cbFollow')">
                <span class="i18n" data-th="ติดตามสินค้าให้ลูกค้า" data-en="Following up on a product for customer">ติดตามสินค้าให้ลูกค้า</span>
            </label>
        </div>

        <label class="i18n" data-th="รายละเอียดสินค้า / สิ่งที่ลูกค้าต้องการ" data-en="Product Details / Customer Request">รายละเอียดสินค้า / สิ่งที่ลูกค้าต้องการ</label>
        <textarea id="detail" class="i18n-ph" data-th-ph="เช่น ลูกค้าสอบถาม Dr Pepper ขนาด 355 ml" data-en-ph="e.g., Customer inquiry about Dr Pepper 355ml"></textarea>

        <label class="i18n" data-th="ชื่อลูกค้า / เบอร์ติดต่อ" data-en="Customer Name / Contact">ชื่อลูกค้า / เบอร์ติดต่อ</label>
        <input id="customer" class="i18n-ph" data-th-ph="ถ้ามี" data-en-ph="Optional">

        <label class="i18n" data-th="การดำเนินการ / ผลการตรวจสอบ" data-en="Action / Follow-up Status">การดำเนินการ / ผลการตรวจสอบ</label>
        <textarea id="requestAction" class="i18n-ph" data-th-ph="เช่น ตรวจสอบสาขาอื่น / ประสานจัดซื้อ" data-en-ph="e.g., Check other branches / Contact purchasing"></textarea>

        <label class="i18n" data-th="สถานะ" data-en="Status">สถานะ</label>
        <select id="status">
            <option value="เสร็จสิ้น" class="i18n" data-th="เสร็จสิ้น" data-en="Completed">เสร็จสิ้น</option>
            <option value="รอดำเนินการ" class="i18n" data-th="รอดำเนินการ" data-en="Pending">รอดำเนินการ</option>
        </select>

        <button id="submitBtn" onclick="saveData()" class="i18n" data-th="บันทึกข้อมูล" data-en="Submit Data">บันทึกข้อมูล</button>
        <div id="msg" class="status"><span class="i18n" data-th="สถานะ :" data-en="Status :">สถานะ :</span> <span id="status-text" class="i18n" data-th="เริ่มต้น" data-en="Ready">เริ่มต้น</span></div>
    </div>
</div>

<script>
    const LIFF_ID = "2011171771-2kU5r1Xp";
    const API_URL = "https://script.google.com/macros/s/AKfycbzGCd61ZDWRSXVibhE73_fW8eZX-R-pLlOSAUI5fFPdNdZ3-cUMVGsOAwRNP754ugq8YQ/exec";
    let lineUser = {};
    let currentLang = 'TH';

    // ทำให้ checkbox 2 ตัวเลือกได้แค่ตัวเดียว (เหมือน radio button)
    function selectRequestType(selectedId) {
        const ids = ['cbAsk', 'cbFollow'];
        ids.forEach(id => {
            if (id !== selectedId) document.getElementById(id).checked = false;
        });
    }

    function switchLanguage(lang) {
        currentLang = lang;

        document.querySelectorAll('.i18n').forEach(el => {
            const text = el.getAttribute(`data-${lang.toLowerCase()}`);
            if (text) el.innerText = text;
        });
        document.querySelectorAll('.i18n-ph').forEach(input => {
            const ph = input.getAttribute(`data-${lang.toLowerCase()}-ph`);
            if (ph) input.placeholder = ph;
        });
    }

    async function initLINE() {
        try {
            await liff.init({ liffId: LIFF_ID });
            if (!liff.isLoggedIn()) {
                liff.login();
                return;
            }
            const profile = await liff.getProfile();
            lineUser = { id: profile.userId, name: profile.displayName };
            document.getElementById("userName").innerText = profile.displayName;

            const res = await fetch(`${API_URL}?action=getUserLang&lineUserId=${profile.userId}`).then(r => r.json());
            
            if (res.registered) {
                document.getElementById("form-content").style.display = "block";
                if (res.lang) switchLanguage(res.lang);
            } else {
                document.getElementById("access-denied").style.display = "block";
            }

        } catch (e) {
            document.getElementById("access-denied").style.display = "block";
        }
    }

    async function saveData() {
        const submitBtn = document.getElementById("submitBtn");
        if (submitBtn.disabled) return;

        const detail = document.getElementById("detail").value.trim();
        const customer = document.getElementById("customer").value.trim();
        const requestAction = document.getElementById("requestAction").value.trim();

        // เช็คทุกช่องต้องกรอก
        if (detail === "") {
            alert(currentLang === 'TH' ? "กรุณากรอกรายละเอียด" : "Please enter details");
            return;
        }
        if (customer === "") {
            alert(currentLang === 'TH' ? "กรุณากรอกชื่อลูกค้า / เบอร์ติดต่อ" : "Please enter customer name/contact");
            return;
        }
        if (requestAction === "") {
            alert(currentLang === 'TH' ? "กรุณากรอกการดำเนินการ / ผลการตรวจสอบ" : "Please enter action/result");
            return;
        }

        const requestTypes = [];
        if (document.getElementById("cbAsk").checked) requestTypes.push(document.getElementById("cbAsk").value);
        if (document.getElementById("cbFollow").checked) requestTypes.push(document.getElementById("cbFollow").value);

        if (requestTypes.length === 0) {
            alert(currentLang === 'TH' ? "กรุณาเลือกประเภทเรื่องอย่างน้อย 1 รายการ" : "Please select at least one request type");
            return;
        }

        const data = {
            action: "saveCustomer",
            type: "ติดตามสินค้า_2",
            requestType: requestTypes.join(", "),
            detail: detail,
            customer: customer,
            requestAction: requestAction,
            status: document.getElementById("status").value,
            userName: lineUser.name,
            lineUserId: lineUser.id
        };

        submitBtn.disabled = true;
        submitBtn.style.opacity = "0.6";
        submitBtn.style.cursor = "not-allowed";

        try {
            document.getElementById("status-text").innerText = currentLang === 'TH' ? "กำลังบันทึกข้อมูล..." : "Saving...";
            const response = await fetch(API_URL, {
                method: "POST",
                headers: { "Content-Type": "text/plain" },
                body: JSON.stringify(data)
            });
            const result = await response.json();
            alert(result.message || (currentLang === 'TH' ? "บันทึกสำเร็จ" : "Saved successfully"));
            if (result.success) {
                liff.closeWindow();
            } else {
                submitBtn.disabled = false;
                submitBtn.style.opacity = "1";
                submitBtn.style.cursor = "pointer";
                document.getElementById("status-text").innerText = currentLang === 'TH' ? "เริ่มต้น" : "Ready";
            }
        } catch (err) {
            alert(currentLang === 'TH' ? "เกิดข้อผิดพลาดในการบันทึกข้อมูล" : "Error saving data");
            document.getElementById("status-text").innerText = currentLang === 'TH' ? "เกิดข้อผิดพลาด" : "Error";
            submitBtn.disabled = false;
            submitBtn.style.opacity = "1";
            submitBtn.style.cursor = "pointer";
        }
    }

    initLINE();
</script>
</body>
</html>
