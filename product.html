<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ระบบบันทึกข้อมูลติดตามสินค้า</title>
  <!-- LIFF SDK -->
  <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- SweetAlert2 -->
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <style>
    body { font-family: 'Sukhumvit Set', 'Kanit', sans-serif; }
  </style>
</head>
<body class="bg-gray-100 min-h-screen p-4">
  <div class="max-w-md mx-auto bg-white rounded-xl shadow-md overflow-hidden md:max-w-2xl p-6">
    
    <!-- ส่วนหัวข้อฟอร์ม -->
    <div class="mb-6 text-center border-b pb-4">
      <h2 id="lbl-title" class="text-2xl font-bold text-gray-800">ระบบบันทึกข้อมูลติดตามสินค้า</h2>
      <p id="lbl-subtitle" class="text-sm text-gray-500 mt-1">กรอกข้อมูลการติดตามสินค้าเพื่อบันทึกเข้าสู่ระบบ</p>
    </div>

    <!-- ฟอร์มกรอกข้อมูล -->
    <form id="csForm" onsubmit="handleSubmit(event)" class="space-y-4">
      
      <!-- 1. เลือกประเภทตัวเลือก Checkbox (เหลือ 2 หัวข้อ: สอบถามสินค้า, ติดตามสินค้า) -->
      <div>
        <label id="lbl-checkbox-group" class="block text-sm font-medium text-gray-700 mb-2">หัวข้อการติดตาม (เลือกได้มากกว่า 1 ข้อ)</label>
        <div class="space-y-2 bg-gray-50 p-3 rounded-lg border">
          <label class="flex items-center space-x-3 cursor-pointer">
            <input type="checkbox" name="subType" value="สอบถามสินค้า" class="w-4 h-4 text-blue-600 rounded border-gray-300 focus:ring-blue-500">
            <span class="text-sm text-gray-700 font-medium">สอบถามสินค้า</span>
          </label>
          <label class="flex items-center space-x-3 cursor-pointer">
            <input type="checkbox" name="subType" value="ติดตามสินค้า" class="w-4 h-4 text-blue-600 rounded border-gray-300 focus:ring-blue-500">
            <span class="text-sm text-gray-700 font-medium">ติดตามสินค้า</span>
          </label>
        </div>
      </div>

      <!-- 2. รายละเอียด (Detail) -->
      <div>
        <label id="lbl-detail" class="block text-sm font-medium text-gray-700 mb-1">รายละเอียดงาน / รายการสินค้า *</label>
        <textarea id="detail" rows="3" required class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="ระบุรายละเอียด..."></textarea>
      </div>

      <!-- 3. ชื่อลูกค้า (Customer) -->
      <div>
        <label id="lbl-customer" class="block text-sm font-medium text-gray-700 mb-1">ชื่อลูกค้า / ช่องทางติดต่อ *</label>
        <input type="text" id="customer" required class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="เช่น คุณสมชาย (โทร 081-xxx-xxxx)">
      </div>

      <!-- 4. การดำเนินการที่ขอ (Request Action) -->
      <div>
        <label id="lbl-action" class="block text-sm font-medium text-gray-700 mb-1">การดำเนินการที่ต้องทำต่อ</label>
        <input type="text" id="requestAction" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="เช่น โทรแจ้งกลับเมื่อสินค้าเข้า">
      </div>

      <!-- 5. สถานะงาน (Status) -->
      <div>
        <label id="lbl-status" class="block text-sm font-medium text-gray-700 mb-1">สถานะงาน *</label>
        <select id="status" required class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
          <option value="รอดำเนินการ">รอดำเนินการ (Pending)</option>
          <option value="กำลังดำเนินการ">กำลังดำเนินการ (In Progress)</option>
          <option value="เสร็จสิ้น">เสร็จสิ้น (Completed)</option>
        </select>
      </div>

      <!-- ปุ่มกดบันทึก -->
      <button type="submit" id="btn-submit" class="w-full bg-blue-600 text-white py-2 px-4 rounded-md hover:bg-blue-700 transition duration-200 font-medium text-lg mt-4">
        💾 บันทึกข้อมูล
      </button>

    </form>
  </div>

  <script>
    // ⚠️ ใส่ LIFF ID ของคุณที่นี่
    const MY_LIFF_ID = "YOUR_LIFF_ID_HERE"; 
    let userProfile = null;
    let userLang = "TH";

    // เริ่มต้นทำงานเมื่อโหลดหน้าเว็บ
    window.onload = async function() {
      try {
        await liff.init({ liffId: MY_LIFF_ID });
        if (!liff.isLoggedIn()) {
          liff.login();
          return;
        }
        userProfile = await liff.getProfile();
        
        // ดึงภาษาและตรวจสอบสิทธิ์จาก Apps Script
        await fetchUserLang(userProfile.userId);
      } catch (err) {
        console.error("LIFF Init Error:", err);
      }
    };

    // ดึงภาษาประจำตัวพนักงานจากระบบ
    async function fetchUserLang(lineUserId) {
      try {
        const res = await fetch(`<?= ScriptApp.getService().getUrl() ?>?action=getUserLang&lineUserId=${lineUserId}`);
        const data = await res.json();
        
        if (!data.registered) {
          Swal.fire({
            icon: 'error',
            title: 'ไม่พบสิทธิ์การใช้งาน',
            text: 'กรุณาติดต่อผู้ดูแลระบบเพื่อลงทะเบียนพนักงานก่อนใช้งาน',
            allowOutsideClick: false
          }).then(() => { liff.closeWindow(); });
          return;
        }

        userLang = data.lang || "TH";
        applyLanguageUi(userLang);
      } catch (e) {
        console.error("Fetch Lang Error:", e);
      }
    }

    // ปรับเปลี่ยนข้อความตามภาษาของพนักงานอัตโนมัติ
    function applyLanguageUi(lang) {
      if (lang === "EN") {
        document.getElementById('lbl-title').innerText = "Product Tracking System";
        document.getElementById('lbl-subtitle').innerText = "Fill in tracking details to save into the system";
        document.getElementById('lbl-checkbox-group').innerText = "Tracking Categories (Select multiple)";
        document.getElementById('lbl-detail').innerText = "Details / Product Items *";
        document.getElementById('detail').placeholder = "Enter details...";
        document.getElementById('lbl-customer').innerText = "Customer Name / Contact *";
        document.getElementById('customer').placeholder = "e.g. John Doe (Tel 081-xxx-xxxx)";
        document.getElementById('lbl-action').innerText = "Requested Action";
        document.getElementById('requestAction').placeholder = "e.g. Call back when stock arrives";
        document.getElementById('lbl-status').innerText = "Status *";
        document.getElementById('btn-submit').innerText = "💾 Save Data";
      }
    }

    // ส่งข้อมูลบันทึก
    async function handleSubmit(e) {
      e.preventDefault();

      // รวบรวมค่า Checkbox ที่ถูกเลือก
      const selectedCheckboxes = Array.from(document.querySelectorAll('input[name="subType"]:checked'))
        .map(cb => cb.value);

      const formData = {
        action: "saveCustomer",
        type: "ติดตามสินค้า_2",
        subTypes: selectedCheckboxes, // ส่งไปบันทึกลงคอลัมน์ Sub-Type
        detail: document.getElementById('detail').value,
        customer: document.getElementById('customer').value,
        requestAction: document.getElementById('requestAction').value,
        status: document.getElementById('status').value,
        lineUserId: userProfile ? userProfile.userId : "",
        userName: userProfile ? userProfile.displayName : ""
      };

      Swal.fire({
        title: userLang === "EN" ? 'Saving...' : 'กำลังบันทึกข้อมูล...',
        allowOutsideClick: false,
        didOpen: () => { Swal.showLoading(); }
      });

      try {
        const response = await fetch(`<?= ScriptApp.getService().getUrl() ?>`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(formData)
        });

        const result = await response.json();

        if (result.success) {
          Swal.fire({
            icon: 'success',
            title: userLang === "EN" ? 'Success!' : 'บันทึกสำเร็จ!',
            text: result.message,
            timer: 2000,
            showConfirmButton: false
          }).then(() => {
            liff.closeWindow();
          });
        } else {
          Swal.fire({
            icon: 'warning',
            title: userLang === "EN" ? 'Warning' : 'แจ้งเตือน',
            text: result.message,
            confirmButtonText: userLang === "EN" ? 'OK' : 'ตกลง'
          });
        }
      } catch (err) {
        Swal.fire({
          icon: 'error',
          title: 'Error',
          text: err.toString()
        });
      }
    }
  </script>
</body>
</html>
