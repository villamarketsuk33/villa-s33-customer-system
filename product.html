<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ติดตามสินค้า - Villa Market S33</title>
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; padding: 15px; background: #f3f5f8; font-family: Arial, "Noto Sans Thai", sans-serif; }
        .container { max-width: 480px; margin: auto; }
        .header { background: #005bbb; color: white; padding: 25px; border-radius: 18px; text-align: center; }
        .header h1 { margin: 0; font-size: 26px; }
        .card { background: white; padding: 20px; border-radius: 18px; margin-top: 15px; }
        label { font-weight: bold; display: block; margin-top: 15px; }
        input, textarea, select { width: 100%; padding: 12px; font-size: 16px; border-radius: 10px; border: 1px solid #ccc; margin-top: 8px; }
        textarea { height: 100px; }
        button { width: 100%; height: 55px; margin-top: 20px; background: #005bbb; color: white; border: none; border-radius: 12px; font-size: 18px; font-weight: bold; cursor: pointer; }
        .line-box { background: #eef5ff; padding: 12px; border-radius: 10px; display: flex; justify-content: space-between; align-items: center; }
        .status { font-size: 13px; color: #666; margin-top: 15px; }

        .checkbox-group { margin-top: 8px; display: flex; flex-direction: column; gap: 10px; }
        .checkbox-group.inline { flex-direction: row; gap: 8px; }
        .checkbox-group.inline .checkbox-item { flex: 1; min-width: 0; margin-top: 0; padding: 12px 9px; }
        .checkbox-group.inline .checkbox-item span { font-size: 14px; line-height: 1.35; }
        .checkbox-item { display: flex; align-items: center; background: #f7f9fc; border: 1px solid #ddd; border-radius: 10px; padding: 12px; cursor: pointer; }
        .checkbox-item input[type="checkbox"] { width: auto; margin: 0 10px 0 0; padding: 0; accent-color: #005bbb; transform: scale(1.2); }
        .checkbox-item span { font-weight: normal; }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1 class="i18n" data-th="🔵 ติดตามสินค้า" data-en="🔵 Product Tracking">🔵 ติดตามสินค้า</h1>
        <p>Villa Market สุขุมวิท 33</p>
    </div>

    <div class="card" id="form-content">
        <div class="line-box">
            <div><span class="i18n" data-th="ผู้รับเรื่อง:" data-en="Receiver:">ผู้รับเรื่อง:</span> <span id="userName">กำลังโหลด...</span></div>
        </div>

        <label class="i18n" data-th="ประเภทเรื่อง" data-en="Request Type">ประเภทเรื่อง</label>
        <div class="checkbox-group inline">
            <label class="checkbox-item">
                <input type="checkbox" id="cbAsk" value="ลูกค้าถามหาสินค้า" onclick="selectExclusive('cbAsk', ['cbAsk', 'cbFollow'])">
                <span class="i18n" data-th="ลูกค้าถามหาสินค้า" data-en="Customer asking for a product">ลูกค้าถามหาสินค้า</span>
            </label>
            <label class="checkbox-item">
                <input type="checkbox" id="cbFollow" value="ติดตามสินค้าให้ลูกค้า" onclick="selectExclusive('cbFollow', ['cbAsk', 'cbFollow'])">
                <span class="i18n" data-th="ติดตามสินค้าให้ลูกค้า" data-en="Following up on a product for customer">ติดตามสินค้าให้ลูกค้า</span>
            </label>
        </div>

        <label class="i18n" data-th="การมีจำหน่ายในวิลล่า" data-en="Availability at Villa Market">การมีจำหน่ายในวิลล่า</label>
        <div class="checkbox-group inline">
            <label class="checkbox-item">
                <input type="checkbox" id="cbAvailable" value="มีขายในวิลล่า" onclick="selectExclusive('cbAvailable', ['cbAvailable', 'cbUnavailable'])">
                <span class="i18n" data-th="มีขายในวิลล่า" data-en="Available at Villa Market">มีขายในวิลล่า</span>
            </label>
            <label class="checkbox-item">
                <input type="checkbox" id="cbUnavailable" value="ไม่มีขายในวิลล่า" onclick="selectExclusive('cbUnavailable', ['cbAvailable', 'cbUnavailable'])">
                <span class="i18n" data-th="ไม่มีขายในวิลล่า" data-en="Not available at Villa Market">ไม่มีขายในวิลล่า</span>
            </label>
        </div>

        <label class="i18n" data-th="รายละเอียดสินค้า / สิ่งที่ลูกค้าต้องการ" data-en="Product Details / Customer Request">รายละเอียดสินค้า / สิ่งที่ลูกค้าต้องการ</label>
        <textarea id="detail" class="i18n-ph" data-th-ph="เช่น ลูกค้าสอบถาม Dr Pepper ขนาด 355 ml" data-en-ph="e.g., Customer inquiry about Dr Pepper 355ml"></textarea>

        <label class="i18n" data-th="ชื่อลูกค้า / เบอร์ติดต่อ" data-en="Customer Name / Contact">ชื่อลูกค้า / เบอร์ติดต่อ</label>
        <input id="customer" class="i18n-ph" data-th-ph="ถ้ามี" data-en-ph="Optional">

        <label class="i18n" data-th="การดำเนินการ / ผลการตรวจสอบ" data-en="Action / Follow-up Status">การดำเนินการ / ผลการตรวจสอบ</label>
        <textarea id="requestAction" class="i18n-ph" data-th-ph="เช่น ตรวจสอบสาขาอื่น / ประสานจัดซื้อ" data-en-ph="e.g., Check other branches / Contact purchasing"></textarea>

        <label class="i18n" data-th="สถานะ" data-en="Status">สถานะ</label>
        <select id="status">
            <option value="เสร็จสิ้น" class="i18n" data-th="เสร็จสิ้น" data-en="Completed">เสร็จสิ้น</option>
            <option value="รอดำเนินการ" class="i18n" data-th="รอดำเนินการ" data-en="Pending">รอดำเนินการ</option>
        </select>

        <button id="submitBtn" onclick="saveData()" class="i18n" data-th="บันทึกข้อมูล" data-en="Submit Data">บันทึกข้อมูล</button>
        <div id="msg" class="status"><span class="i18n" data-th="สถานะ :" data-en="Status :">สถานะ :</span> <span id="status-text" class="i18n" data-th="เริ่มต้น" data-en="Ready">เริ่มต้น</span></div>
    </div>
</div>

<script>
    const LIFF_ID = "2011171771-2kU5r1Xp";
    const API_URL = "https://script.google.com/macros/s/AKfycbzGCd61ZDWRSXVibhE73_fW8eZX-R-pLlOSAUI5fFPdNdZ3-cUMVGsOAwRNP754ugq8YQ/exec";
    let lineUser = {};
    let currentLang = 'TH';
    let isSubmitting = false;

    async function readApiResult(response) {
        const responseText = await response.text();
        if (!response.ok) {
            throw new Error(`HTTP ${response.status}`);
        }

        const trimmed = responseText.trim();
        if (trimmed === "" || trimmed.toUpperCase() === "OK") {
            return { success: true };
        }

        try {
            return JSON.parse(trimmed);
        } catch (_) {
            throw new Error("API returned an invalid response");
        }
    }

    function wait(ms) {
        return new Promise(resolve => setTimeout(resolve, ms));
    }

    async function fetchJson(url, timeoutMs = 15000) {
        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), timeoutMs);
        try {
            const response = await fetch(url, {
                method: "GET",
                cache: "no-store",
                redirect: "follow",
                signal: controller.signal
            });
            return await readApiResult(response);
        } finally {
            clearTimeout(timeoutId);
        }
    }

    async function checkDuplicate(data) {
        const params = new URLSearchParams({
            action: "checkDuplicate",
            type: data.type,
            detail: data.detail,
            requestAction: data.requestAction,
            lineUserId: data.lineUserId,
            _ts: Date.now().toString()
        });
        return fetchJson(`${API_URL}?${params.toString()}`);
    }

    async function sendSubmission(data, timeoutMs = 20000) {
        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), timeoutMs);
        try {
            const response = await fetch(API_URL, {
                method: "POST",
                headers: { "Content-Type": "text/plain;charset=UTF-8" },
                body: JSON.stringify(data),
                keepalive: true,
                redirect: "follow",
                signal: controller.signal
            });
            return await readApiResult(response);
        } finally {
            clearTimeout(timeoutId);
        }
    }

    async function submitAndConfirm(data) {
        let postError = null;
        try {
            const result = await sendSubmission(data);
            if (!result || result.success !== true) {
                throw new Error((result && result.message) || "บันทึกข้อมูลไม่สำเร็จ");
            }
            return result;
        } catch (error) {
            postError = error;
        }

        // ตรวจยืนยันเพียงครั้งเดียวเมื่ออ่านผล POST ไม่ได้เท่านั้น
        await wait(1500);
        try {
            const status = await checkDuplicate(data);
            if (status.success && status.complete) {
                return {
                    success: true,
                    duplicate: true,
                    recovered: true,
                    message: "บันทึกข้อมูลเรียบร้อยแล้ว ระบบยืนยันจากรายการล่าสุดของคุณ"
                };
            }
        } catch (_) {}

        throw postError || new Error("ยังไม่สามารถยืนยันผลการบันทึกได้");
    }

    function setSubmitBusy(button, busy) {
        isSubmitting = busy;
        button.disabled = busy;
        button.style.opacity = busy ? "0.6" : "1";
        button.style.cursor = busy ? "not-allowed" : "pointer";
    }

    // ทำให้ checkbox ในแต่ละกลุ่มเลือกได้เพียง 1 ตัว (เหมือน radio button)
    function selectExclusive(selectedId, ids) {
        ids.forEach(id => {
            if (id !== selectedId) document.getElementById(id).checked = false;
        });
    }

    function switchLanguage(lang) {
        currentLang = lang;

        document.querySelectorAll('.i18n').forEach(el => {
            const text = el.getAttribute(`data-${lang.toLowerCase()}`);
            if (text) el.innerText = text;
        });
        document.querySelectorAll('.i18n-ph').forEach(input => {
            const ph = input.getAttribute(`data-${lang.toLowerCase()}-ph`);
            if (ph) input.placeholder = ph;
        });
    }

    async function initLINE() {
        try {
            await liff.init({ liffId: LIFF_ID });
            if (!liff.isLoggedIn()) {
                liff.login();
                return;
            }
            const profile = await liff.getProfile();
            lineUser = { id: profile.userId, name: profile.displayName };
            document.getElementById("userName").innerText = profile.displayName;

            // เช็กสิทธิ์และภาษาจากระบบ Employee_Master เบื้องหลัง (ฟอร์มแสดงอยู่แล้วระหว่างรอผล)
            fetch(`${API_URL}?action=getUserLang&lineUserId=${profile.userId}`)
                .then(res => res.json())
                .then(res => {
                    if (res.registered) {
                        // ถ้าลงทะเบียนแล้ว ให้สลับภาษาตามตั้งค่า
                        if (res.lang) switchLanguage(res.lang);
                    } else {
                        // ถ้ายังไม่ได้ลงทะเบียน ซ่อนฟอร์มและขึ้นเตือนทันทีโดยไม่ต้องแก้ HTML
                        const card = document.getElementById("form-content");
                        if (card) {
                            card.innerHTML = `
                                <div style="text-align: center; padding: 15px 5px;">
                                    <h2 style="color: #d71920; margin-top: 0; font-size: 22px;">⚠️ ไม่พบข้อมูลพนักงาน</h2>
                                    <p style="color: #555; font-size: 15px; margin: 15px 0 20px 0;">กรุณาลงทะเบียนพนักงานก่อนเข้าใช้งานระบบ</p>
                                    <button onclick="liff.closeWindow()" style="background: #d71920; color: white; border: none; padding: 12px 24px; border-radius: 10px; font-size: 16px; font-weight: bold; cursor: pointer; width: 100%; max-width: 200px;">ปิดหน้าต่าง</button>
                                </div>
                            `;
                        }
                    }
                })
                .catch(err => console.log("Lang check error:", err));

        } catch (e) {
            document.getElementById("userName").innerText = "ไม่สามารถดึงข้อมูล LINE ได้";
            if (document.getElementById("status-text")) {
                document.getElementById("status-text").innerText = "Error: " + e.message;
            }
        }
    }

    async function saveData() {
        const submitBtn = document.getElementById("submitBtn");
        if (isSubmitting || submitBtn.disabled) return;

        const detail = document.getElementById("detail").value.trim();
        const customer = document.getElementById("customer").value.trim();
        const requestAction = document.getElementById("requestAction").value.trim();

        // เช็คทุกช่องต้องกรอก
        if (detail === "") {
            alert(currentLang === 'TH' ? "กรุณากรอกรายละเอียด" : "Please enter details");
            return;
        }
        if (customer === "") {
            alert(currentLang === 'TH' ? "กรุณากรอกชื่อลูกค้า / เบอร์ติดต่อ" : "Please enter customer name/contact");
            return;
        }
        if (requestAction === "") {
            alert(currentLang === 'TH' ? "กรุณากรอกการดำเนินการ / ผลการตรวจสอบ" : "Please enter action/result");
            return;
        }

        const requestTypes = [];
        if (document.getElementById("cbAsk").checked) requestTypes.push(document.getElementById("cbAsk").value);
        if (document.getElementById("cbFollow").checked) requestTypes.push(document.getElementById("cbFollow").value);

        if (requestTypes.length === 0) {
            alert(currentLang === 'TH' ? "กรุณาเลือกประเภทเรื่องอย่างน้อย 1 รายการ" : "Please select at least one request type");
            return;
        }

        let villaAvailability = "";
        if (document.getElementById("cbAvailable").checked) villaAvailability = document.getElementById("cbAvailable").value;
        if (document.getElementById("cbUnavailable").checked) villaAvailability = document.getElementById("cbUnavailable").value;

        if (villaAvailability === "") {
            alert(currentLang === 'TH' ? "กรุณาเลือกว่ามีขายหรือไม่มีขายในวิลล่า" : "Please select Villa Market availability");
            return;
        }

        const data = {
            action: "saveCustomer",
            type: "ติดตามสินค้า_2",
            requestType: requestTypes.join(", ") + " | " + villaAvailability,
            villaAvailability: villaAvailability,
            detail: detail,
            customer: customer,
            requestAction: requestAction,
            status: document.getElementById("status").value,
            userName: lineUser.name,
            lineUserId: lineUser.id
        };

        if (!lineUser.id) {
            alert(currentLang === 'TH' ? "กรุณารอให้ระบบโหลดข้อมูลผู้รับเรื่องให้เสร็จก่อน" : "Please wait for the user profile to finish loading");
            return;
        }

        setSubmitBusy(submitBtn, true);
        try {
            document.getElementById("status-text").innerText = currentLang === 'TH' ? "กำลังบันทึกข้อมูล..." : "Saving...";
            const result = await submitAndConfirm(data);

            document.getElementById("status-text").innerText = result.duplicate
                ? (currentLang === 'TH' ? "พบข้อมูลเดิม — ไม่บันทึกซ้ำ" : "Duplicate found — not saved again")
                : (currentLang === 'TH' ? "บันทึกสำเร็จ" : "Saved");
            alert(result.message || (currentLang === 'TH' ? "บันทึกสำเร็จ" : "Saved successfully"));
            liff.closeWindow();
        } catch (err) {
            alert(currentLang === 'TH'
                ? "ยังไม่สามารถยืนยันผลได้ สามารถกดบันทึกอีกครั้ง ระบบจะตรวจ 10 รายการล่าสุดของผู้ใช้และไม่บันทึกข้อความซ้ำ"
                : "The result could not be confirmed. You may retry; the system checks your 10 latest records before saving.");
            document.getElementById("status-text").innerText = currentLang === 'TH' ? "ยังยืนยันผลไม่ได้ — สามารถลองใหม่" : "Not confirmed — please retry";
            setSubmitBusy(submitBtn, false);
        }
    }

    initLINE();
</script>
</body>
</html>
