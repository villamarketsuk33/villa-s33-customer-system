<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>บันทึกการติดตามสินค้า</title>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <style>
    body {
      font-family: 'Helvetica Neue', Arial, sans-serif;
      background-color: #f4f7f6;
      margin: 0;
      padding: 15px;
      color: #333;
    }
    .card {
      background: #ffffff;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.08);
      max-width: 480px;
      margin: 0 auto;
    }
    .user-info {
      font-size: 14px;
      color: #555;
      margin-bottom: 15px;
      padding-bottom: 10px;
      border-bottom: 1px solid #eee;
    }
    h2 {
      margin-top: 0;
      color: #00b900;
      font-size: 20px;
      text-align: center;
    }
    .form-group {
      margin-bottom: 15px;
    }
    label {
      display: block;
      margin-bottom: 6px;
      font-weight: bold;
      font-size: 14px;
    }
    input[type="text"], textarea, select {
      width: 100%;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 6px;
      box-sizing: border-box;
      font-size: 14px;
    }
    .checkbox-group {
      background: #f9f9f9;
      padding: 10px 12px;
      border-radius: 6px;
      border: 1px solid #e2e2e2;
    }
    .checkbox-item {
      display: flex;
      align-items: center;
      margin-bottom: 8px;
    }
    .checkbox-item:last-child {
      margin-bottom: 0;
    }
    .checkbox-item input[type="checkbox"] {
      width: 18px;
      height: 18px;
      margin-right: 10px;
      cursor: pointer;
    }
    .btn-submit {
      width: 100%;
      background-color: #00b900;
      color: white;
      border: none;
      padding: 12px;
      font-size: 16px;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
      margin-top: 10px;
    }
    .btn-submit:disabled {
      background-color: #ccc;
    }
  </style>
</head>
<body>

<div class="card">
  <h2>📦 บันทึกข้อมูลติดตามสินค้า</h2>
  
  <!-- แสดงชื่อ User (ถอดปุ่มเปลี่ยนภาษาออกแล้ว) -->
  <div class="user-info">
    👤 ผู้ใช้งาน: <span id="userNameDisplay">กำลังโหลด...</span>
  </div>

  <form id="trackingForm">
    <!-- Checkbox 2 ตัวเลือก -->
    <div class="form-group">
      <label id="lblCategory">ประเภทเรื่องที่ติดตาม (เลือกได้มากกว่า 1 ข้อ):</label>
      <div class="checkbox-group">
        <div class="checkbox-item">
          <input type="checkbox" id="chkTracking" name="trackingOption" value="ติดตามสินค้า">
          <label for="chkTracking" style="margin:0; font-weight:normal;">📦 ติดตามสินค้า</label>
        </div>
        <div class="checkbox-item">
          <input type="checkbox" id="chkInquiry" name="trackingOption" value="ลูกค้าถามหาสินค้า">
          <label for="chkInquiry" style="margin:0; font-weight:normal;">❓ ลูกค้าถามหาสินค้า</label>
        </div>
      </div>
    </div>

    <div class="form-group">
      <label id="lblDetail">รายละเอียดสินค้า / ปัญหา:</label>
      <textarea id="detail" rows="3" placeholder="ระบุรายละเอียดสินค้า..." required></textarea>
    </div>

    <div class="form-group">
      <label id="lblCustomer">ชื่อลูกค้า / ช่องทางการติดต่อ:</label>
      <input type="text" id="customer" placeholder="ระบุชื่อลูกค้า หรือเบอร์โทร..." required>
    </div>

    <div class="form-group">
      <label id="lblAction">การดำเนินการต่อไป:</label>
      <input type="text" id="requestAction" placeholder="เช่น ส่งเรื่องให้คลัง, แจ้งกลับลูกค้า...">
    </div>

    <div class="form-group">
      <label id="lblStatus">สถานะงาน:</label>
      <select id="status">
        <option value="รอดำเนินการ">รอดำเนินการ</option>
        <option value="กำลังดำเนินการ">กำลังดำเนินการ</option>
        <option value="เสร็จสิ้น">เสร็จสิ้น</option>
      </select>
    </div>

    <button type="button" class="btn-submit" id="btnSubmit" onclick="submitForm()">💾 บันทึกข้อมูล</button>
  </form>
</div>

<script>
  let userLineId = "";
  let userDisplayName = "";

  // 1. Initial LIFF
  window.onload = function () {
    // เปลี่ยน YOUR_LIFF_ID เป็น LIFF ID ของคุณ
    liff.init({ liffId: "2011171771-2kU5r1Xp" }).then(() => {
      if (liff.isLoggedIn()) {
        liff.getProfile().then(profile => {
          userLineId = profile.userId;
          userDisplayName = profile.displayName;
          document.getElementById("userNameDisplay").innerText = userDisplayName;
          
          checkUserAuthAndLang(userLineId);
        });
      } else {
        liff.login();
      }
    }).catch(err => {
      console.error("LIFF Init Error: ", err);
      // กรณีทดสอบใน Web Browser
      document.getElementById("userNameDisplay").innerText = "Test User";
    });
  };

  // 2. ตรวจสอบสิทธิ์และสลับภาษาจาก คอลัมน์ L อัตโนมัติ
  function checkUserAuthAndLang(lineUserId) {
    google.script.run.withSuccessHandler(function(response) {
      const data = JSON.parse(response);
      if (!data.registered) {
        alert("⚠️ คุณไม่มีสิทธิ์ใช้งานระบบ กรุณาติดต่อผู้ดูแลระบบ");
        liff.closeWindow();
        return;
      }
      
      // สลับภาษา UI ในหน้าเว็บตามคอลัมน์ L
      if (data.lang === "EN") {
        applyEnglishUI();
      }
    }).doGet({ action: "getUserLang", lineUserId: lineUserId });
  }

  // 3. ฟังก์ชันปรับ Label สำหรับภาษาอังกฤษ (หากคอลัมน์ L เป็น EN)
  function applyEnglishUI() {
    document.getElementById("lblCategory").innerText = "Tracking Category (Select all that apply):";
    document.getElementById("lblDetail").innerText = "Product Detail / Issue:";
    document.getElementById("lblCustomer").innerText = "Customer Name / Contact:";
    document.getElementById("lblAction").innerText = "Action Required:";
    document.getElementById("lblStatus").innerText = "Status:";
    document.getElementById("btnSubmit").innerText = "💾 Save Data";
  }

  // 4. บันทึกข้อมูล
  function submitForm() {
    const detail = document.getElementById("detail").value.trim();
    const customer = document.getElementById("customer").value.trim();
    const requestAction = document.getElementById("requestAction").value.trim();
    const status = document.getElementById("status").value;

    // รวบรวมค่าจาก Checkbox
    let selectedSubTypes = [];
    document.querySelectorAll('input[name="trackingOption"]:checked').forEach((chk) => {
      selectedSubTypes.push(chk.value);
    });

    if (selectedSubTypes.length === 0) {
      alert("⚠️ กรุณาเลือกประเภทเรื่องที่ติดตามอย่างน้อย 1 ข้อ");
      return;
    }

    if (!detail || !customer) {
      alert("⚠️ กรุณากรอกรายละเอียดและชื่อลูกค้าให้ครบถ้วน");
      return;
    }

    const btn = document.getElementById("btnSubmit");
    btn.disabled = true;
    btn.innerText = "⏳ กำลังบันทึก...";

    const payload = {
      action: "saveCustomer",
      type: "ติดตามสินค้า_2",
      subTypes: selectedSubTypes,
      detail: detail,
      customer: customer,
      requestAction: requestAction,
      status: status,
      lineUserId: userLineId,
      userName: userDisplayName
    };

    google.script.run.withSuccessHandler(function(response) {
      btn.disabled = false;
      btn.innerText = "💾 บันทึกข้อมูล";

      const res = JSON.parse(response);
      if (res.success) {
        alert("✅ " + res.message);
        liff.closeWindow(); // บันทึกสำเร็จ ปิดหน้าต่าง LIFF
      } else {
        alert(res.message); // หากซ้ำ จะแจ้งเตือน และไม่ปิดหน้าต่างเพื่อให้แก้ไข
      }
    }).doPost(payload);
  }
</script>

</body>
</html>
