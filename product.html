<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>คำชมลูกค้า - Villa Market S33</title>
  <!-- LIFF SDK -->
  <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- SweetAlert2 -->
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <style>
    body { font-family: 'Sukhumvit Set', 'Kanit', Arial, sans-serif; }
    .bg-vm-green { background-color: #008f39; }
    .border-vm-green { border-color: #008f39; }
    .text-vm-green { color: #008f39; }
  </style>
</head>
<body class="bg-gray-100 min-h-screen p-4">
  <div class="max-w-md mx-auto bg-white rounded-2xl shadow-md overflow-hidden md:max-w-2xl p-6">
    
    <!-- ส่วนหัวข้อฟอร์ม -->
    <div class="bg-vm-green text-white p-6 rounded-xl text-center relative mb-4">
      <h1 id="lbl-title" class="text-2xl font-bold">🟢 คำชมลูกค้า</h1>
      <p id="lbl-subtitle" class="text-sm opacity-90 mt-1">Villa Market สุขุมวิท 33</p>
    </div>

    <!-- ส่วนแสดงผู้บันทึก & ปุ่มสลับภาษา -->
    <div class="bg-green-50 p-3 rounded-lg border border-green-200 flex justify-between items-center mb-4 text-sm">
      <div class="text-gray-700">
        <span id="lbl-recorder-title" class="font-bold">ผู้บันทึก:</span> 
        <span id="userName" class="font-medium text-vm-green">กำลังโหลด...</span>
      </div>
      <div class="flex gap-1">
        <button type="button" id="btn-th" onclick="switchLanguage('TH')" class="px-3 py-1 text-xs font-bold rounded-full bg-vm-green text-white transition">TH</button>
        <button type="button" id="btn-en" onclick="switchLanguage('EN')" class="px-3 py-1 text-xs font-bold rounded-full bg-white text-vm-green border border-vm-green transition">EN</button>
      </div>
    </div>

    <!-- ฟอร์มกรอกข้อมูล -->
    <form id="complimentForm" onsubmit="handleSubmit(event)" class="space-y-4">
      
      <!-- 1. รายละเอียดคำชม -->
      <div>
        <label id="lbl-detail" class="block text-sm font-bold text-gray-700 mb-1">รายละเอียดคำชมจากลูกค้า *</label>
        <textarea id="detail" rows="3" required class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-green-500" placeholder="เช่น ลูกค้าชื่นชมพนักงานบริการดี ช่วยแนะนำสินค้า"></textarea>
      </div>

      <!-- 2. ชื่อลูกค้า / เบอร์ติดต่อ -->
      <div>
        <label id="lbl-customer" class="block text-sm font-bold text-gray-700 mb-1">ชื่อลูกค้า / เบอร์ติดต่อ</label>
        <input type="text" id="customer" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-green-500" placeholder="ถ้ามี (เช่น คุณสมชาย 081-xxx-xxxx)">
      </div>

      <!-- 3. Action จากพนักงาน -->
      <div>
        <label id="lbl-action" class="block text-sm font-bold text-gray-700 mb-1">Action จากพนักงาน</label>
        <textarea id="action" rows="2" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-green-500" placeholder="ดำเนินการอย่างไร"></textarea>
      </div>

      <!-- 4. สถานะ -->
      <div>
        <label id="lbl-status" class="block text-sm font-bold text-gray-700 mb-1">สถานะ *</label>
        <select id="status" required class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-green-500 bg-white">
          <option value="เสร็จสิ้น">เสร็จสิ้น (Completed)</option>
          <option value="รอดำเนินการ">รอดำเนินการ (Pending)</option>
        </select>
      </div>

      <!-- ปุ่มบันทึก -->
      <button type="submit" id="btn-submit" class="w-full bg-vm-green text-white py-3 px-4 rounded-xl hover:bg-green-700 transition duration-200 font-bold text-lg mt-4 shadow-md">
        บันทึกข้อมูล
      </button>

      <div class="text-xs text-gray-500 text-center mt-2">
        <span id="lbl-status-title">สถานะ :</span> <span id="status-text" class="font-medium text-gray-700">พร้อมใช้งาน</span>
      </div>

    </form>
  </div>

  <script>
    // ⚠️ ตั้งค่า LIFF ID และ API URL
    const MY_LIFF_ID = "2011171771-2kU5r1Xp"; 
    const API_URL = "https://script.google.com/macros/s/AKfycbzGCd61ZDWRSXVibhE73_fW8eZX-R-pLlOSAUI5fFPdNdZ3-cUMVGsOAwRNP754ugq8YQ/exec";

    let userProfile = null;
    let currentLang = "TH";

    // เริ่มต้นทำงานเมื่อโหลดหน้าเว็บ
    window.onload = async function() {
      try {
        await liff.init({ liffId: MY_LIFF_ID });
        if (!liff.isLoggedIn()) {
          liff.login();
          return;
        }
        userProfile = await liff.getProfile();
        document.getElementById("userName").innerText = userProfile.displayName;
        
        // ตรวจสอบสิทธิ์พนักงานและดึงภาษาตั้งต้น
        await fetchUserLang(userProfile.userId);
      } catch (err) {
        console.error("LIFF Init Error:", err);
        document.getElementById("userName").innerText = "ไม่สามารถดึงข้อมูล LINE ได้";
        document.getElementById("status-text").innerText = "Error: " + err.message;
      }
    };

    // ตรวจสอบสิทธิ์พนักงานจากระบบ
    async function fetchUserLang(lineUserId) {
      try {
        const res = await fetch(`${API_URL}?action=getUserLang&lineUserId=${lineUserId}`);
        const data = await res.json();
        
        if (!data.registered) {
          Swal.fire({
            icon: 'error',
            title: 'ไม่พบสิทธิ์การใช้งาน',
            text: 'กรุณาติดต่อผู้ดูแลระบบเพื่อลงทะเบียนพนักงานก่อนใช้งาน',
            allowOutsideClick: false
          }).then(() => { liff.closeWindow(); });
          return;
        }

        currentLang = data.lang || "TH";
        switchLanguage(currentLang);
      } catch (e) {
        console.error("Fetch Lang Error:", e);
      }
    }

    // ฟังก์ชันสลับภาษา UI
    function switchLanguage(lang) {
      currentLang = lang;
      
      const btnTh = document.getElementById('btn-th');
      const btnEn = document.getElementById('btn-en');
      
      if (lang === 'TH') {
        btnTh.className = "px-3 py-1 text-xs font-bold rounded-full bg-vm-green text-white transition";
        btnEn.className = "px-3 py-1 text-xs font-bold rounded-full bg-white text-vm-green border border-vm-green transition";
        
        document.getElementById('lbl-title').innerText = "🟢 คำชมลูกค้า";
        document.getElementById('lbl-subtitle').innerText = "Villa Market สุขุมวิท 33";
        document.getElementById('lbl-recorder-title').innerText = "ผู้บันทึก:";
        document.getElementById('lbl-detail').innerText = "รายละเอียดคำชมจากลูกค้า *";
        document.getElementById('detail').placeholder = "เช่น ลูกค้าชื่นชมพนักงานบริการดี ช่วยแนะนำสินค้า";
        document.getElementById('lbl-customer').innerText = "ชื่อลูกค้า / เบอร์ติดต่อ";
        document.getElementById('customer').placeholder = "ถ้ามี (เช่น คุณสมชาย 081-xxx-xxxx)";
        document.getElementById('lbl-action').innerText = "Action จากพนักงาน";
        document.getElementById('action').placeholder = "ดำเนินการอย่างไร";
        document.getElementById('lbl-status').innerText = "สถานะ *";
        document.getElementById('btn-submit').innerText = "บันทึกข้อมูล";
        document.getElementById('lbl-status-title').innerText = "สถานะ :";
        document.getElementById('status-text').innerText = "พร้อมใช้งาน";
      } else {
        btnTh.className = "px-3 py-1 text-xs font-bold rounded-full bg-white text-vm-green border border-vm-green transition";
        btnEn.className = "px-3 py-1 text-xs font-bold rounded-full bg-vm-green text-white transition";
        
        document.getElementById('lbl-title').innerText = "🟢 Customer Compliment";
        document.getElementById('lbl-subtitle').innerText = "Villa Market Sukhumvit 33";
        document.getElementById('lbl-recorder-title').innerText = "Recorded by:";
        document.getElementById('lbl-detail').innerText = "Compliment Details *";
        document.getElementById('detail').placeholder = "e.g., Customer praised helpful service";
        document.getElementById('lbl-customer').innerText = "Customer Name / Contact";
        document.getElementById('customer').placeholder = "Optional (e.g. John Doe 081-xxx-xxxx)";
        document.getElementById('lbl-action').innerText = "Action Taken";
        document.getElementById('action').placeholder = "Action details";
        document.getElementById('lbl-status').innerText = "Status *";
        document.getElementById('btn-submit').innerText = "Submit Data";
        document.getElementById('lbl-status-title').innerText = "Status :";
        document.getElementById('status-text').innerText = "Ready";
      }
    }

    // ส่งข้อมูลบันทึก
    async function handleSubmit(e) {
      e.preventDefault();

      const detail = document.getElementById("detail").value.trim();
      if (!detail) {
        Swal.fire({
          icon: 'warning',
          title: currentLang === 'TH' ? 'แจ้งเตือน' : 'Warning',
          text: currentLang === 'TH' ? 'กรุณากรอกรายละเอียดคำชม' : 'Please enter compliment details',
          confirmButtonText: currentLang === 'TH' ? 'ตกลง' : 'OK'
        });
        return;
      }

      const formData = {
        action: "saveCustomer",
        type: "คำชมลูกค้า",
        detail: detail,
        customer: document.getElementById("customer").value.trim(),
        requestAction: document.getElementById("action").value.trim(),
        status: document.getElementById("status").value,
        lineUserId: userProfile ? userProfile.userId : "",
        userName: userProfile ? userProfile.displayName : ""
      };

      Swal.fire({
        title: currentLang === "EN" ? 'Saving...' : 'กำลังบันทึกข้อมูล...',
        allowOutsideClick: false,
        didOpen: () => { Swal.showLoading(); }
      });

      try {
        const response = await fetch(API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain' },
          body: JSON.stringify(formData)
        });

        const result = await response.json();

        if (result.success) {
          Swal.fire({
            icon: 'success',
            title: currentLang === "EN" ? 'Success!' : 'บันทึกสำเร็จ!',
            text: result.message || (currentLang === 'TH' ? 'บันทึกข้อมูลเรียบร้อยแล้ว' : 'Data saved successfully'),
            timer: 2000,
            showConfirmButton: false
          }).then(() => {
            liff.closeWindow();
          });
        } else {
          Swal.fire({
            icon: 'warning',
            title: currentLang === "EN" ? 'Warning' : 'แจ้งเตือน',
            text: result.message,
            confirmButtonText: currentLang === "EN" ? 'OK' : 'ตกลง'
          });
        }
      } catch (err) {
        Swal.fire({
          icon: 'error',
          title: 'Error',
          text: err.toString()
        });
        document.getElementById("status-text").innerText = "Error: " + err.message;
      }
    }
  </script>
</body>
</html>
