<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>คำชมลูกค้า - Villa Market S33</title>
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; padding: 15px; background: #f3f5f8; font-family: Arial, "Noto Sans Thai", sans-serif; }
        .container { max-width: 480px; margin: auto; }
        .header { background: #008f39; color: white; padding: 25px; border-radius: 18px; text-align: center; position: relative; }
        .header h1 { margin: 0; font-size: 26px; }
        .card { background: white; padding: 20px; border-radius: 18px; margin-top: 15px; }
        label { font-weight: bold; display: block; margin-top: 15px; }
        input, textarea, select { width: 100%; padding: 12px; font-size: 16px; border-radius: 10px; border: 1px solid #ccc; margin-top: 8px; }
        textarea { height: 120px; }
        button { width: 100%; height: 55px; margin-top: 20px; border: none; border-radius: 12px; background: #008f39; color: white; font-size: 18px; font-weight: bold; cursor: pointer; }
        button:disabled { cursor: not-allowed; }
        .line-user { background: #eef8ef; padding: 12px; border-radius: 10px; display: flex; justify-content: space-between; align-items: center; }
        .status { font-size: 13px; color: #777; margin-top: 15px; }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1 class="i18n" data-th="🟢 คำชมลูกค้า" data-en="🟢 Customer Compliment">🟢 คำชมลูกค้า</h1>
        <p>Villa Market สุขุมวิท 33</p>
    </div>

    <div class="card">
        <div class="line-user">
            <div><span class="i18n" data-th="ผู้บันทึก:" data-en="Recorded by:">ผู้บันทึก:</span> <span id="userName">กำลังโหลด...</span></div>
        </div>

        <label class="i18n" data-th="รายละเอียดคำชมจากลูกค้า" data-en="Compliment Details">รายละเอียดคำชมจากลูกค้า</label>
        <textarea id="detail" class="i18n-ph" data-th-ph="เช่น ลูกค้าชื่นชมพนักงานบริการดี ช่วยแนะนำสินค้า" data-en-ph="e.g., Customer praised helpful service"></textarea>

        <label class="i18n" data-th="ชื่อลูกค้า / เบอร์ติดต่อ" data-en="Customer Name / Contact">ชื่อลูกค้า / เบอร์ติดต่อ</label>
        <input id="customer" class="i18n-ph" data-th-ph="ถ้ามี" data-en-ph="Optional" />

        <label class="i18n" data-th="Action จากพนักงาน" data-en="Action Taken">Action จากพนักงาน</label>
        <textarea id="action" class="i18n-ph" data-th-ph="ดำเนินการอย่างไร" data-en-ph="Action details"></textarea>

        <label class="i18n" data-th="สถานะ" data-en="Status">สถานะ</label>
        <select id="status">
            <option value="เสร็จสิ้น" class="i18n" data-th="เสร็จสิ้น" data-en="Completed">เสร็จสิ้น</option>
            <option value="รอดำเนินการ" class="i18n" data-th="รอดำเนินการ" data-en="Pending">รอดำเนินการ</option>
        </select>

        <button id="submitBtn" onclick="saveData()" class="i18n" data-th="บันทึกข้อมูล" data-en="Submit Data">บันทึกข้อมูล</button>
        <div class="status" id="msg"><span class="i18n" data-th="สถานะ :" data-en="Status :">สถานะ :</span> <span id="status-text" class="i18n" data-th="พร้อมใช้งาน" data-en="Ready">พร้อมใช้งาน</span></div>
    </div>
</div>

<script>
    const LIFF_ID = "2011171771-2kU5r1Xp";
    const API_URL = "https://script.google.com/macros/s/AKfycbxIOPBytMpBpi4hdCFuETHczMaCCGLOIm5NQu__cIOwURPPc9JmLg6Qq4eXfs6vO646iw/exec";
    let lineUser = { id: "", name: "" };
    let currentLang = 'TH';
    let isSubmitting = false;

    async function readApiResult(response) {
        const responseText = await response.text();
        if (!response.ok) {
            throw new Error(`HTTP ${response.status}`);
        }

        const trimmed = responseText.trim();
        if (trimmed === "" || trimmed.toUpperCase() === "OK") {
            return { success: true };
        }

        try {
            return JSON.parse(trimmed);
        } catch (_) {
            throw new Error("API returned an invalid response");
        }
    }

    function wait(ms) {
        return new Promise(resolve => setTimeout(resolve, ms));
    }

    // 🔑 รหัสประจำการส่ง 1 ค่าต่อการกดบันทึก 1 ครั้ง
    // ถ้าต้อง retry จะใช้ค่าเดิม เซิร์ฟเวอร์จึงรู้ว่าเป็นรายการเดียวกันและไม่บันทึกซ้ำ
    function newSubmissionId() {
        if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
        return "s-" + Date.now() + "-" + Math.random().toString(36).slice(2, 10);
    }

    // แจ้งเตือนแบบไม่บล็อกหน้าจอ (แทน alert ที่ทำให้รู้สึกสะดุด/กระตุก)
    function showBanner(message, type) {
        let banner = document.getElementById("vm-banner");
        if (!banner) {
            banner = document.createElement("div");
            banner.id = "vm-banner";
            banner.style.cssText = "position:fixed;left:12px;right:12px;bottom:16px;padding:12px 16px;border-radius:12px;font-size:14px;line-height:1.4;z-index:9999;box-shadow:0 4px 14px rgba(0,0,0,0.18);transition:opacity .25s ease;";
            document.body.appendChild(banner);
        }
        banner.style.background = type === "error" ? "#fdecea" : "#e8f5e9";
        banner.style.color = type === "error" ? "#b3261e" : "#1e7e34";
        banner.textContent = message;
        banner.style.opacity = "1";
        clearTimeout(banner._hideTimer);
        banner._hideTimer = setTimeout(() => { banner.style.opacity = "0"; }, 5000);
    }

    function showError(message) {
        showBanner(message, "error");
    }

    // Modal ยืนยันบันทึกสำเร็จ — ให้ user กดปิดเอง แทนการปิดหน้าต่างอัตโนมัติ
    // เพราะปิดเองแบบไม่มีคำอธิบายอาจทำให้ user บางคนเข้าใจว่าฟอร์มมีปัญหา
    function showSuccessModal(message) {
        let overlay = document.getElementById("vm-success-modal");
        if (!overlay) {
            overlay = document.createElement("div");
            overlay.id = "vm-success-modal";
            overlay.style.cssText = "position:fixed;inset:0;background:rgba(0,0,0,0.45);display:flex;align-items:center;justify-content:center;z-index:10000;padding:20px;";
            overlay.innerHTML =
                '<div style="background:#fff;border-radius:16px;padding:28px 24px;max-width:320px;width:100%;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,0.25);">' +
                    '<div style="font-size:44px;line-height:1;margin-bottom:12px;">✅</div>' +
                    '<div id="vm-success-modal-text" style="font-size:17px;font-weight:bold;color:#222;margin-bottom:20px;line-height:1.5;"></div>' +
                    '<button id="vm-success-modal-btn" style="width:100%;height:50px;border:none;border-radius:10px;background:#1e7e34;color:#fff;font-size:16px;font-weight:bold;cursor:pointer;"></button>' +
                '</div>';
            document.body.appendChild(overlay);
            document.getElementById("vm-success-modal-btn").onclick = () => {
                try { liff.closeWindow(); } catch (_) { overlay.style.display = "none"; }
            };
        }
        document.getElementById("vm-success-modal-text").innerText = message;
        document.getElementById("vm-success-modal-btn").innerText = currentLang === 'TH' ? "ปิดหน้าต่าง" : "Close";
        overlay.style.display = "flex";
    }

    async function fetchJson(url, timeoutMs = 15000) {
        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), timeoutMs);
        try {
            const response = await fetch(url, {
                method: "GET",
                cache: "no-store",
                redirect: "follow",
                signal: controller.signal
            });
            return await readApiResult(response);
        } finally {
            clearTimeout(timeoutId);
        }
    }

    // ตรวจย้อนด้วย submissionId — ฝั่งเซิร์ฟเวอร์อ่านจาก Cache ไม่แตะ Google Sheets
    // จึงตอบกลับเร็วกว่าการไล่เทียบข้อความ 50 แถวแบบเดิมมาก
    async function checkSubmission(data) {
        const params = new URLSearchParams({
            action: "checkSubmission",
            submissionId: data.submissionId,
            _ts: Date.now().toString()
        });
        return fetchJson(`${API_URL}?${params.toString()}`, 8000);
    }

    async function sendSubmission(data, timeoutMs = 20000) {
        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), timeoutMs);
        try {
            const response = await fetch(API_URL, {
                method: "POST",
                headers: { "Content-Type": "text/plain;charset=UTF-8" },
                body: JSON.stringify(data),
                keepalive: true,
                redirect: "follow",
                signal: controller.signal
            });
            return await readApiResult(response);
        } finally {
            clearTimeout(timeoutId);
        }
    }

    // 🔁 ยิงซ้ำอัตโนมัติสูงสุด 3 ครั้งขณะที่ user ยังอยู่หน้าจอเดิม (ปุ่ม disabled รออยู่)
    // ปลอดภัยเพราะใช้ submissionId เดิมทุกครั้ง เซิร์ฟเวอร์เช็คซ้ำได้จาก Cache/Sheet
    // แตกต่างจากของเดิมตรงที่ "ไม่ปิดหน้าต่างจนกว่าจะรู้ผลจริง" — ไม่มี background retry
    async function submitAndConfirm(data, onProgress) {
        const maxAttempts = 3;
        let lastError = null;

        for (let attempt = 1; attempt <= maxAttempts; attempt++) {
            try {
                if (onProgress) onProgress(attempt, maxAttempts);
                const result = await sendSubmission(data);
                if (result && result.success === true) return result;
                lastError = new Error((result && result.message) || "บันทึกไม่สำเร็จ");
            } catch (error) {
                lastError = error;
            }

            // อ่านผลไม่ได้ (มักเกิดจาก 302 redirect ของ Apps Script) หรือ network สะดุด
            // ตรวจย้อนด้วย submissionId ก่อนตัดสินใจ retry เผื่อจริงๆ บันทึกสำเร็จไปแล้ว
            try {
                const status = await checkSubmission(data);
                if (status.success && status.saved) {
                    return Object.assign({ success: true, recovered: true }, status.result || {});
                }
            } catch (_) {}

            if (attempt < maxAttempts) await wait(1500 * attempt); // 1.5s, 3s ก่อน retry รอบถัดไป
        }

        throw lastError || new Error("ยังไม่สามารถยืนยันผลการบันทึกได้");
    }

    function setSubmitBusy(button, busy) {
        isSubmitting = busy;
        button.disabled = busy;
        button.style.opacity = busy ? "0.6" : "1";
        button.style.cursor = busy ? "not-allowed" : "pointer";
    }

    function switchLanguage(lang) {
        currentLang = lang;

        document.querySelectorAll('.i18n').forEach(el => {
            const text = el.getAttribute(`data-${lang.toLowerCase()}`);
            if (text) el.innerText = text;
        });
        document.querySelectorAll('.i18n-ph').forEach(input => {
            const ph = input.getAttribute(`data-${lang.toLowerCase()}-ph`);
            if (ph) input.placeholder = ph;
        });
    }

    async function initLINE() {
        try {
            await liff.init({ liffId: LIFF_ID });
            if (!liff.isLoggedIn()) {
                liff.login();
                return;
            }
            const profile = await liff.getProfile();
            lineUser = { id: profile.userId, name: profile.displayName };
            document.getElementById("userName").innerText = profile.displayName;

            // เช็กสิทธิ์และภาษาจากระบบ Employee_Master เบื้องหลัง
            fetch(`${API_URL}?action=getUserLang&lineUserId=${profile.userId}`)
                .then(res => res.json())
                .then(res => {
                    if (res.registered) {
                        // ถ้าลงทะเบียนแล้ว ให้สลับภาษาตามตั้งค่า (handle uppercase/lowercase)
                        if (res.lang) switchLanguage(res.lang.toUpperCase());
                    } else {
                        // ถ้ายังไม่ได้ลงทะเบียน ซ่อนฟอร์มและขึ้นเตือนเตือนทันที
                        const card = document.querySelector(".card");
                        if (card) {
                            card.innerHTML = `
                                <div style="text-align: center; padding: 15px 5px;">
                                    <h2 style="color: #d71920; margin-top: 0; font-size: 22px;">⚠️ ไม่พบข้อมูลพนักงาน</h2>
                                    <p style="color: #555; font-size: 15px; margin: 15px 0 20px 0;">กรุณาลงทะเบียนพนักงานก่อนเข้าใช้งานระบบ</p>
                                    <button onclick="liff.closeWindow()" style="background: #d71920; color: white; border: none; padding: 12px 24px; border-radius: 10px; font-size: 16px; font-weight: bold; cursor: pointer; width: 100%; max-width: 200px;">ปิดหน้าต่าง</button>
                                </div>
                            `;
                        }
                    }
                })
                .catch(err => console.log("Lang check error:", err));

        } catch (e) {
            document.getElementById("userName").innerText = "ไม่สามารถดึงข้อมูล LINE ได้";
            document.getElementById("status-text").innerText = "Error: " + e.message;
        }
    }

    async function saveData() {
        const submitBtn = document.getElementById("submitBtn");
        if (isSubmitting || submitBtn.disabled) return;

        const detail = document.getElementById("detail").value.trim();
        const customer = document.getElementById("customer").value.trim();
        const action = document.getElementById("action").value.trim();

        // เช็คทุกช่องต้องกรอก
        if (detail === "") {
            showError(currentLang === 'TH' ? "กรุณากรอกรายละเอียดคำชม" : "Please enter compliment details");
            return;
        }
        if (customer === "") {
            showError(currentLang === 'TH' ? "กรุณากรอกชื่อลูกค้า / เบอร์ติดต่อ" : "Please enter customer name/contact");
            return;
        }
        if (action === "") {
            showError(currentLang === 'TH' ? "กรุณากรอก Action จากพนักงาน" : "Please enter action taken");
            return;
        }

        const data = {
            action: "saveCustomer",
            submissionId: newSubmissionId(),
            type: "คำชมลูกค้า",
            detail: detail,
            customer: customer,
            requestAction: action,
            status: document.getElementById("status").value,
            userName: lineUser.name,
            lineUserId: lineUser.id
        };

        if (!lineUser.id) {
            showError(currentLang === 'TH' ? "กรุณารอให้ระบบโหลดข้อมูลผู้บันทึกให้เสร็จก่อน" : "Please wait for the user profile to finish loading");
            return;
        }

        // ⏳ บันทึกจริงแบบรอผลก่อนปิดหน้าต่าง — ไม่ใช่ Optimistic UI อีกต่อไป
        setSubmitBusy(submitBtn, true);
        document.getElementById("status-text").innerText = currentLang === 'TH' ? "กำลังบันทึก..." : "Saving...";

        try {
            await submitAndConfirm(data, (attempt, max) => {
                if (attempt > 1) {
                    const msg = currentLang === 'TH' ? `กำลังลองใหม่ (${attempt}/${max})...` : `Retrying (${attempt}/${max})...`;
                    document.getElementById("status-text").innerText = msg;
                }
            });
            document.getElementById("status-text").innerText = currentLang === 'TH' ? "บันทึกสำเร็จ!" : "Saved!";
            showSuccessModal(currentLang === 'TH' ? "บันทึกข้อมูลเรียบร้อยแล้ว" : "Saved successfully");
        } catch (err) {
            setSubmitBusy(submitBtn, false);
            document.getElementById("status-text").innerText = currentLang === 'TH' ? "บันทึกไม่สำเร็จ" : "Save failed";
            showError(currentLang === 'TH' ? "บันทึกไม่สำเร็จ กรุณากดบันทึกอีกครั้ง" : "Save failed, please try again");
        }
    }

    initLINE();
</script>
</body>
</html>
