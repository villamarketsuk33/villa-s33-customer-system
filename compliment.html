<!DOCTYPE html>
<html lang="th">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>
คำชมลูกค้า - Villa Market S33
</title>


<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>


<style>

*{
box-sizing:border-box;
}


body{

margin:0;
padding:15px;
background:#f3f5f8;
font-family:
Arial,
"Noto Sans Thai",
sans-serif;

}


.container{

max-width:480px;
margin:auto;

}


.header{

background:#008f39;
color:white;
padding:25px;
border-radius:18px;
text-align:center;

}


.card{

background:white;
padding:20px;
margin-top:15px;
border-radius:18px;

}


label{

font-weight:bold;
display:block;
margin-top:15px;

}


input,
textarea,
select{

width:100%;
padding:12px;
font-size:16px;
border-radius:10px;
border:1px solid #ccc;
margin-top:8px;

}


textarea{

height:120px;

}


button{

width:100%;
height:55px;
margin-top:20px;
background:#008f39;
color:white;
border:none;
border-radius:12px;
font-size:18px;
font-weight:bold;

}


.line-box{

background:#eef8ef;
padding:12px;
border-radius:10px;

}


.status{

margin-top:15px;
font-size:13px;
color:#666;

}

</style>

</head>


<body>


<div class="container">


<div class="header">

<h1>
🟢 คำชมลูกค้า
</h1>

<p>
Villa Market สุขุมวิท 33
</p>

</div>



<div class="card">


<div class="line-box">

ผู้บันทึก:

<span id="userName">
กำลังโหลด...
</span>

</div>



<label>
รายละเอียดคำชมจากลูกค้า
</label>


<textarea id="detail"></textarea>



<label>
ชื่อลูกค้า / เบอร์ติดต่อ
</label>


<input id="customer">



<label>
Action จากพนักงาน
</label>


<textarea id="requestAction"></textarea>



<label>
สถานะ
</label>


<select id="status">

<option>
เสร็จสิ้น
</option>

<option>
รอดำเนินการ
</option>


</select>



<button onclick="saveData()">

บันทึกข้อมูล

</button>



<div class="status" id="msg">

สถานะ : เริ่มต้น

</div>


</div>


</div>




<script>


const LIFF_ID =
"2011171771-2kU5r1Xp";



const API_URL =
"https://script.google.com/macros/s/AKfycbyYwFxNc6yQIJZU8Md4ocY89pESFeleZFGjw6erVVh4lEfQXBceJhOUNkVPSRfVTW-S_g/exec";



let lineUser={};



async function initLINE(){


await liff.init({

liffId:LIFF_ID

});


if(!liff.isLoggedIn()){

liff.login();

return;

}



const profile =
await liff.getProfile();



lineUser={

id:profile.userId,

name:profile.displayName

};



document
.getElementById("userName")
.innerHTML =
profile.displayName;


}




async function saveData(){



const data={


action:
"saveCustomer",


type:
"คำชมลูกค้า",


detail:
document
.getElementById("detail")
.value,



customer:
document
.getElementById("customer")
.value,



requestAction:
document
.getElementById("requestAction")
.value,



status:
document
.getElementById("status")
.value,



userName:
lineUser.name,



lineUserId:
lineUser.id


};




const response =
await fetch(

API_URL,

{

method:"POST",

body:
JSON.stringify(data)

}

);



const result =
await response.json();



alert(result.message);



}




initLINE();


</script>


</body>

</html>
